<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عصفور للتعدين والحراريات | المساعد الذكي للموارد البشرية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ASFOUR AI HR PORTAL — STYLESHEET
   Theme: soft premium corporate glassmorphism, RTL Arabic
   ========================================================= */

:root{
  /* brand */
  --navy: #0B3B6F;
  --navy-deep: #062142;
  --orange: #F58220;
  --orange-soft: #ffd9ae;

  /* light theme surface */
  --bg-1: #eef3fa;
  --bg-2: #e4ecf7;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.65);
  --text: #16232f;
  --text-muted: #5c7085;
  --shadow-soft: 0 10px 40px rgba(11,59,111,0.10);
  --shadow-strong: 0 20px 60px rgba(11,59,111,0.18);
  --sky-top: #bcd6f5;
  --sky-bottom: #eef3fa;
  --star-opacity: 0;

  --radius-lg: 26px;
  --radius-md: 18px;
  --radius-sm: 12px;

  --font-ar: 'Cairo', sans-serif;
  --ease: cubic-bezier(.22,1,.36,1);
}

html[data-theme="dark"]{
  --bg-1: #0a1220;
  --bg-2: #060c16;
  --glass-bg: rgba(20,28,42,0.55);
  --glass-border: rgba(255,255,255,0.08);
  --text: #eef2f7;
  --text-muted: #93a3b8;
  --shadow-soft: 0 10px 40px rgba(0,0,0,0.35);
  --shadow-strong: 0 20px 70px rgba(0,0,0,0.55);
  --sky-top: #050a14;
  --sky-bottom: #0a1220;
  --star-opacity: 1;
}

*{margin:0; padding:0; box-sizing:border-box;}

body{
  font-family: var(--font-ar);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  transition: color .6s var(--ease);
}

::selection{ background: var(--orange-soft); }

/* =========================================================
   ANIMATED SKY BACKGROUND
   ========================================================= */
.bg-scene{
  position: fixed; inset: 0; z-index: -1; overflow: hidden;
}
.sky{
  position: absolute; inset: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  transition: background 1.1s var(--ease);
}
.sun, .moon{
  position: absolute; width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 28px;
  animation: arcMove 26s linear infinite;
  transition: opacity 1.1s var(--ease);
}
.sun{
  color: #fff;
  background: radial-gradient(circle at 35% 30%, #ffe6a8, var(--orange) 70%);
  box-shadow: 0 0 60px 18px rgba(245,130,32,0.55);
  opacity: 1;
}
.moon{
  color: #dfe8f5;
  background: radial-gradient(circle at 35% 30%, #f5f8ff, #b9c6de 75%);
  box-shadow: 0 0 40px 10px rgba(180,200,230,0.45);
  opacity: 0;
  animation-delay: -13s; /* opposite point of the arc from the sun */
}
html[data-theme="dark"] .sun{ opacity: 0; }
html[data-theme="dark"] .moon{ opacity: 1; }

/* rises on the right, arcs overhead, sets on the left — like a real sunrise/sunset */
@keyframes arcMove{
  0%   { left: 90%; top: 62%; transform: scale(.8); }
  15%  { left: 74%; top: 22%; transform: scale(1); }
  50%  { left: 50%; top: 6%;  transform: scale(1.08); }
  85%  { left: 26%; top: 22%; transform: scale(1); }
  100% { left: 10%; top: 62%; transform: scale(.8); }
}

.stars{
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 25% 55%, #fff, transparent),
    radial-gradient(1px 1px at 40% 15%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 55% 70%, #fff, transparent),
    radial-gradient(1px 1px at 70% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 85% 60%, #fff, transparent),
    radial-gradient(1px 1px at 92% 20%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 15% 80%, #fff, transparent),
    radial-gradient(1px 1px at 65% 88%, #fff, transparent);
  opacity: var(--star-opacity);
  transition: opacity 1.2s var(--ease) .3s;
}

/* =========================================================
   THEME TOGGLE
   ========================================================= */
.theme-toggle{
  position: fixed; top: 22px; left: 22px; z-index: 100;
  background: var(--glass-bg); backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border); border-radius: 40px;
  padding: 4px; box-shadow: var(--shadow-soft);
}
.toggle-track{
  width: 58px; height: 30px; border-radius: 30px; display: block; position: relative;
  background: linear-gradient(90deg, var(--navy), var(--navy-deep));
}
.toggle-thumb{
  position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--navy); transition: transform .5s var(--ease), color .5s;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
html[data-theme="dark"] .toggle-thumb{ transform: translateX(-28px); color: #1c2740; }

/* =========================================================
   REVEAL / INTRO ANIMATION
   ========================================================= */
.reveal{ opacity: 0; }
.reveal.show{ animation: fadeUp 1s var(--ease) forwards; }
#revealTitle.show{ animation: fadeIn 1.1s var(--ease) forwards; }
#revealHR.show{ animation: slideIn 1s var(--ease) forwards; }
#revealChat.show{ animation: fadeUp 1.2s var(--ease) forwards; }

@keyframes fadeUp{
  from{ opacity: 0; transform: translateY(26px); }
  to{ opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn{
  from{ opacity: 0; transform: scale(.96); }
  to{ opacity: 1; transform: scale(1); }
}
@keyframes slideIn{
  from{ opacity: 0; transform: translateX(30px); }
  to{ opacity: 1; transform: translateX(0); }
}

/* =========================================================
   HEADER
   ========================================================= */
.site-header{ padding: 34px 5vw 18px; }
.header-inner{
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; flex-wrap: wrap;
}
.header-left, .header-center, .header-right{ flex: 1; min-width: 220px; }
.header-center{ text-align: center; }
.header-right{ text-align: left; }

.header-center h1{
  font-size: clamp(22px, 3vw, 34px); font-weight: 900; color: var(--navy);
  letter-spacing: .3px;
}
html[data-theme="dark"] .header-center h1{ color: #eaf1fb; }
.title-underline{
  display: block; width: 90px; height: 4px; margin: 10px auto 0;
  background: linear-gradient(90deg, var(--orange), var(--navy)); border-radius: 4px;
}

.hr-main{ font-size: 19px; font-weight: 800; color: var(--navy); }
html[data-theme="dark"] .hr-main{ color: #eaf1fb; }
.hr-sub{ font-size: 13.5px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

/* ---------- transparent glass diamond, logo static at the center ---------- */
.crystal-wrap{
  position: relative; width: 140px; height: 160px;
  perspective: 900px;
}
.crystal-glow{
  position: absolute; inset: -25%; border-radius: 50%; z-index: 0;
  background: radial-gradient(circle, rgba(245,130,32,0.30), transparent 70%);
  filter: blur(10px);
  animation: pulseGlow 3.5s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{ opacity: .5; transform: scale(1); }
  50%{ opacity: .85; transform: scale(1.08); }
}

/* the logo does NOT rotate — it stays flat, sharp and readable */
.crystal-logo{
  position: absolute; top: 50%; left: 50%; width: 68px; height: auto; z-index: 3;
  transform: translate(-50%,-50%);
  border-radius: 10px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.2));
  animation: floatCrystal 5s ease-in-out infinite;
}

/* only the faceted glass shell rotates in front of / around the logo */
.crystal{
  position: absolute; inset: 0; z-index: 4;
  transform-style: preserve-3d;
  animation: rotateCrystal 14s linear infinite, floatCrystal 5s ease-in-out infinite;
}
@keyframes rotateCrystal{
  from{ transform: rotateY(0deg) rotateX(10deg); }
  to{ transform: rotateY(360deg) rotateX(10deg); }
}
@keyframes floatCrystal{
  0%, 100%{ margin-top: 0px; }
  50%{ margin-top: -10px; }
}
.crystal-face{
  position: absolute; inset: 6%;
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); /* diamond / rhombus facet */
  background: linear-gradient(155deg,
    rgba(255,255,255,0.32) 0%,
    rgba(255,255,255,0.04) 35%,
    rgba(245,130,32,0.10) 65%,
    rgba(255,255,255,0.22) 100%);
  border: 1px solid rgba(255,255,255,0.55);
  backdrop-filter: blur(0.5px);
}
.face-1{ transform: rotateY(0deg)   translateZ(38px); }
.face-2{ transform: rotateY(90deg)  translateZ(38px); }
.face-3{ transform: rotateY(180deg) translateZ(38px); }
.face-4{ transform: rotateY(270deg) translateZ(38px); }

.crystal-reflection{
  position: absolute; bottom: -14px; left: 50%; width: 68%; height: 16px; z-index: 1;
  transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(ellipse, rgba(11,59,111,0.22), transparent 70%);
  filter: blur(3px);
}

/* =========================================================
   CHAT SHELL
   ========================================================= */
.chat-shell{
  display: flex; justify-content: center; padding: 20px 5vw 60px;
}
.chat-container{
  width: 100%; max-width: 880px;
  background: var(--glass-bg); backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-strong);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.chat-window{
  padding: 26px; display: flex; flex-direction: column; gap: 18px;
  max-height: 55vh; min-height: 300px; overflow-y: auto;
  scroll-behavior: smooth;
}
.chat-window::-webkit-scrollbar{ width: 8px; }
.chat-window::-webkit-scrollbar-thumb{ background: rgba(11,59,111,0.2); border-radius: 10px; }

.msg-row{ display: flex; gap: 12px; max-width: 82%; animation: msgIn .45s var(--ease); }
.msg-row.user{ align-self: flex-end; flex-direction: row-reverse; }
.msg-row.bot{ align-self: flex-start; }
@keyframes msgIn{
  from{ opacity: 0; transform: translateY(10px); }
  to{ opacity: 1; transform: translateY(0); }
}

.avatar{
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff;
  box-shadow: var(--shadow-soft);
}
.avatar.small{ width: 30px; height: 30px; font-size: 13px; }
.bot-avatar{ background: linear-gradient(135deg, var(--navy), var(--navy-deep)); }
.user-avatar{ background: linear-gradient(135deg, var(--orange), #c85f0f); }

.msg-col{ display: flex; flex-direction: column; gap: 6px; }
.msg-row.user .msg-col{ align-items: flex-end; }

.bubble{
  padding: 13px 17px; border-radius: var(--radius-md); font-size: 14.5px; line-height: 1.8;
  box-shadow: var(--shadow-soft);
}
.bot-bubble{
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
  color: var(--text);
}
.user-bubble{
  background: linear-gradient(135deg, var(--navy), var(--navy-deep));
  color: #fff; border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md);
}
.msg-time{ font-size: 11px; color: var(--text-muted); padding: 0 4px; }

/* typing indicator */
.typing-indicator{
  display: none; align-items: center; gap: 10px; padding: 0 26px 14px;
}
.typing-indicator.show{ display: flex; }
.typing-bubble{
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
  padding: 12px 16px; display: flex; gap: 5px;
}
.typing-bubble span{
  width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted);
  animation: typingBounce 1.2s infinite ease-in-out;
}
.typing-bubble span:nth-child(2){ animation-delay: .15s; }
.typing-bubble span:nth-child(3){ animation-delay: .3s; }
@keyframes typingBounce{
  0%,60%,100%{ transform: translateY(0); opacity: .5; }
  30%{ transform: translateY(-5px); opacity: 1; }
}

/* =========================================================
   INPUT BAR
   ========================================================= */
.input-area{ border-top: 1px solid var(--glass-border); background: rgba(255,255,255,0.15); }

.attachment-preview{
  display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px;
}
.attachment-preview:not(:empty){ padding-top: 12px; }
.attachment-chip{
  display: flex; align-items: center; gap: 8px;
  background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 6px 8px 6px 12px; font-size: 12.5px; color: var(--text); max-width: 220px;
}
.attachment-chip i.chip-icon{ color: var(--navy); flex-shrink: 0; }
.attachment-chip span{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attachment-chip .chip-remove{
  width: 20px; height: 20px; border-radius: 50%; background: rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px;
  color: var(--text-muted); transition: background .15s;
}
.attachment-chip .chip-remove:hover{ background: rgba(214,69,69,0.18); color: var(--danger, #d64545); }

.recording-badge{
  display: none; align-items: center; gap: 8px; padding: 10px 20px 0;
  font-size: 13px; color: #d64545; font-weight: 700;
}
.recording-badge.show{ display: flex; }
.rec-dot{
  width: 9px; height: 9px; border-radius: 50%; background: #d64545;
  animation: recPulse 1.2s infinite;
}
@keyframes recPulse{
  0%{ box-shadow: 0 0 0 0 rgba(214,69,69,.5); }
  70%{ box-shadow: 0 0 0 9px rgba(214,69,69,0); }
  100%{ box-shadow: 0 0 0 0 rgba(214,69,69,0); }
}

.icon-action.recording{
  background: rgba(214,69,69,0.14); color: #d64545; border-color: rgba(214,69,69,0.3);
  animation: recPulse 1.2s infinite;
}
.icon-action.has-file{ background: var(--orange-soft); color: var(--orange); }

.chat-input-bar{
  display: flex; align-items: flex-end; gap: 10px; padding: 16px 20px;
}
.textarea-wrap{ flex: 1; }
#chatInput{
  width: 100%; resize: none; border: none; outline: none; background: transparent;
  font-family: var(--font-ar); font-size: 14.5px; color: var(--text);
  line-height: 1.6; max-height: 50vh; overflow-y: auto; padding: 10px 4px;
}
#chatInput::placeholder{ color: var(--text-muted); }

.icon-action{
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center; font-size: 15px;
  transition: background .2s, color .2s, transform .15s;
}
.icon-action:hover{ color: var(--navy); transform: translateY(-2px); }
.icon-action:active{ transform: scale(.94); }

.send-btn{
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--orange), #c85f0f); color: #fff; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px rgba(245,130,32,0.4);
  transition: transform .15s, box-shadow .2s;
}
.send-btn:hover{ transform: translateY(-2px) scale(1.03); }
.send-btn:active{ transform: scale(.93); }

/* =========================================================
   FOOTER
   ========================================================= */
.site-footer{
  text-align: center; padding: 24px 0 34px;
  font-family: 'Cairo', sans-serif; font-size: 12px; letter-spacing: .5px;
  color: var(--text-muted); opacity: .55;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 780px){
  .header-inner{ flex-direction: column; text-align: center; }
  .header-right{ text-align: center; }
  .crystal-wrap{ width: 110px; height: 110px; }
  .chat-window{ max-height: 50vh; }
}
@media (max-width: 480px){
  .chat-input-bar{ padding: 12px; }
  .icon-action{ width: 36px; height: 36px; }
  .send-btn{ width: 40px; height: 40px; }
}

@media (prefers-reduced-motion: reduce){
  .crystal{ animation: none; }
  .reveal{ opacity: 1; animation: none !important; }
}

</style>
</head>

        </button>

</main>

<footer class="site-footer">
  <span>Created by Tarek Hassan</span>
</footer>

<script>
/* =========================================================
   ASFOUR AI HR PORTAL — SCRIPT
   ========================================================= */

// 1) Replace with your live n8n webhook if this ever changes.
const webhookURL = "https://hrtarek.app.n8n.cloud/webhook/08d0e0ed-8278-4840-8a07-e244ecb9ae83/chat";
const voiceWebhookURL = "https://hrtarek.app.n8n.cloud/webhook/voice-chat";

function getSessionId(){
  let sid = null;
  try{ sid = localStorage.getItem('asfour_session_id'); }catch(e){}
  if (!sid){
    sid = 'instance-ai-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    try{ localStorage.setItem('asfour_session_id', sid); }catch(e){}
  }
  return sid;
}
/* ---------------------------------------------------------
   THEME (light / dark) with sun/moon animation
--------------------------------------------------------- */
const root = document.documentElement;
const themeToggle = document.getElementById('themeToggle');

function applyTheme(theme){
  root.setAttribute('data-theme', theme);
  try{ localStorage.setItem('asfour_theme', theme); }catch(e){ /* storage unavailable */ }
}

(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('asfour_theme'); }catch(e){ /* ignore */ }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefersDark ? 'dark' : 'light'));
})();

themeToggle.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
});

/* ---------------------------------------------------------
   CINEMATIC INTRO SEQUENCE
--------------------------------------------------------- */
window.addEventListener('DOMContentLoaded', () => {
  const seq = [
    { id: 'revealLogo',  delay: 150 },
    { id: 'revealTitle', delay: 550 },
    { id: 'revealHR',    delay: 950 },
    { id: 'revealChat',  delay: 1400 },
  ];
  seq.forEach(({ id, delay }) => {
    const el = document.getElementById(id);
    if (!el) return;
    setTimeout(() => el.classList.add('show'), delay);
  });
});

/* ---------------------------------------------------------
   CHAT LOGIC
--------------------------------------------------------- */
const chatWindow   = document.getElementById('chatWindow');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');
const clearBtn     = document.getElementById('clearBtn');
const micBtn       = document.getElementById('micBtn');
const attachBtn    = document.getElementById('attachBtn');
const typingIndicator = document.getElementById('typingIndicator');

function timeNow(){
  return new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
}

function scrollToBottom(){
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

function addMessage(text, sender){
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${sender === 'bot' ? 'bot-avatar' : 'user-avatar'}`;
  avatar.innerHTML = sender === 'bot'
    ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="2"/><circle cx="9" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.3" fill="currentColor" stroke="none"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1" fill="currentColor" stroke="none"/><path d="M2 12h2M20 12h2"/></svg>'
    : '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';

  const col = document.createElement('div');
  col.className = 'msg-col';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${sender === 'bot' ? 'bot-bubble' : 'user-bubble'}`;
  bubble.textContent = text;

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = timeNow();

  col.appendChild(bubble);
  col.appendChild(time);
  row.appendChild(avatar);
  row.appendChild(col);
  chatWindow.appendChild(row);
  scrollToBottom();
}

function setTyping(on){
  typingIndicator.classList.toggle('show', on);
  if (on) scrollToBottom();
}

// Extract a reasonable reply string from whatever shape n8n returns.
function extractReply(data){
  if (typeof data === 'string') return data;
  if (!data) return null;
  return data.reply || data.output || data.text || data.message ||
         (Array.isArray(data) && data[0] && (data[0].output || data[0].text)) ||
         null;
}

async function sendMessage(){
  const text = chatInput.value.trim();
  if (!text && !attachedFile) return;

  const displayText = attachedFile ? `${text ? text + '\n' : ''}📎 ${attachedFile.name}` : text;
  addMessage(displayText, 'user');

  const payload = { message: text, timestamp: new Date().toISOString() };
  if (attachedFile) payload.attachment = { name: attachedFile.name, type: attachedFile.type, data: attachedFile.dataUrl };

  chatInput.value = '';
  autoGrow();
  attachedFile = null;
  renderAttachmentChip();
  setTyping(true);

  try{
    const res = await fetch(webhookURL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    let replyText = 'تم استلام رسالتك.';
    try{
      const data = await res.json();
      replyText = extractReply(data) || replyText;
    }catch(parseErr){
      const raw = await res.text().catch(() => '');
      if (raw) replyText = raw;
    }

    setTyping(false);
    addMessage(replyText, 'bot');

  }catch(err){
    setTyping(false);
    addMessage('تعذر الاتصال بالمساعد الذكي حالياً. برجاء المحاولة مرة أخرى لاحقاً.', 'bot');
  }
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

clearBtn.addEventListener('click', () => {
  chatWindow.innerHTML = '';
  addMessage('تم مسح المحادثة. اسألني عن أي حاجة تخص ملفك الوظيفي.', 'bot');
});

/* ---------------------------------------------------------
   ATTACHMENT (real file picker, shown as a removable chip)
--------------------------------------------------------- */
const fileInput = document.getElementById('fileInput');
const attachmentPreview = document.getElementById('attachmentPreview');
let attachedFile = null; // { name, type, dataUrl }

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    attachedFile = { name: file.name, type: file.type, dataUrl: reader.result };
    renderAttachmentChip();
  };
  reader.readAsDataURL(file);
  fileInput.value = ''; // allow re-selecting the same file later
});

function renderAttachmentChip(){
  attachBtn.classList.toggle('has-file', !!attachedFile);
  if (!attachedFile){
    attachmentPreview.innerHTML = '';
    return;
  }
  attachmentPreview.innerHTML = `
    <div class="attachment-chip">
      <span class="chip-icon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7l9-9a3.5 3.5 0 015 5l-9 9a2 2 0 01-3-3l8-8"/></svg></span>
      <span>${attachedFile.name}</span>
      <span class="chip-remove" id="chipRemove"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg></span>
    </div>`;
  document.getElementById('chipRemove').addEventListener('click', () => {
    attachedFile = null;
    renderAttachmentChip();
  });
}

/* ---------------------------------------------------------
/* ---------------------------------------------------------
   VOICE RECORDING (REAL) — records actual mic audio,
   sends it as multipart/form-data to the Voice Webhook,
   and shows the real bot reply back.
--------------------------------------------------------- */
const recordingBadge = document.getElementById('recordingBadge');
const recTimerEl = document.getElementById('recTimer');
let isRecording = false;
let recStart = null;
let recInterval = null;
let mediaRecorder = null;
let recordedChunks = [];
let mediaStreamRef = null;

function formatElapsed(ms){
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

micBtn.addEventListener('click', () => {
  isRecording ? stopRecording() : startRecording();
});

async function startRecording(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    addMessage('التسجيل الصوتي غير مدعوم في هذا المتصفح.', 'bot');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaStreamRef = stream;

    const preferredTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
    const supportedType = preferredTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));

    mediaRecorder = supportedType ? new MediaRecorder(stream, { mimeType: supportedType }) : new MediaRecorder(stream);
    recordedChunks = [];

    mediaRecorder.addEventListener('dataavailable', (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    });

    mediaRecorder.addEventListener('stop', () => {
      if (mediaStreamRef) mediaStreamRef.getTracks().forEach(t => t.stop());
      handleRecordingStopped();
    });

    mediaRecorder.start();
    isRecording = true;
    recStart = Date.now();
    micBtn.classList.add('recording');
    recordingBadge.classList.add('show');
    recTimerEl.textContent = '0:00';
    recInterval = setInterval(() => {
      recTimerEl.textContent = formatElapsed(Date.now() - recStart);
    }, 250);
  }catch(err){
    addMessage('محتاج إذن استخدام الميكروفون عشان تقدر تبعت رسالة صوتية.', 'bot');
  }
}

function stopRecording(){
  if (!isRecording || !mediaRecorder) return;
  isRecording = false;
  micBtn.classList.remove('recording');
  recordingBadge.classList.remove('show');
  clearInterval(recInterval);
  mediaRecorder.stop();
}

function handleRecordingStopped(){
  const elapsedMs = Date.now() - recStart;
  if (elapsedMs <= 600 || recordedChunks.length === 0) return;

  const duration = formatElapsed(elapsedMs);
  const mimeType = (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm';
  const blob = new Blob(recordedChunks, { type: mimeType });
  const extension = mimeType.includes('mp4') ? 'm4a' : mimeType.includes('ogg') ? 'ogg' : 'webm';
  const fileName = `voice-note-${Date.now()}.${extension}`;

  addMessage(`🎙️ رسالة صوتية (${duration})`, 'user');
  sendVoiceMessage({ name: fileName, blob });
}

async function sendVoiceMessage(voiceFile){
  const formData = new FormData();
  formData.append('data', voiceFile.blob, voiceFile.name);
  formData.append('sessionId', getSessionId());

  setTyping(true);
  try{
    const res = await fetch(voiceWebhookURL, { method: 'POST', body: formData });

    let replyText = 'تم استلام رسالتك الصوتية.';
    try{
      const data = await res.json();
      replyText = extractReply(data) || replyText;
    }catch(parseErr){
      const raw = await res.text().catch(() => '');
      if (raw) replyText = raw;
    }

    setTyping(false);
    addMessage(replyText, 'bot');
  }catch(err){
    setTyping(false);
    addMessage('تعذر إرسال الرسالة الصوتية حالياً. برجاء المحاولة مرة أخرى لاحقاً.', 'bot');
  }
}

/* ---------------------------------------------------------
   AUTO-GROW TEXTAREA (up to 50% of viewport height)
--------------------------------------------------------- */
function autoGrow(){
  chatInput.style.height = 'auto';
  const maxHeight = window.innerHeight * 0.5;
  const newHeight = Math.min(chatInput.scrollHeight, maxHeight);
  chatInput.style.height = newHeight + 'px';
  chatInput.style.overflowY = chatInput.scrollHeight > maxHeight ? 'auto' : 'hidden';
}
chatInput.addEventListener('input', autoGrow);

</script>
